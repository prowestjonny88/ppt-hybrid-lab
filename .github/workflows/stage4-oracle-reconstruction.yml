name: Stage 4 Oracle Editable Reconstruction

on:
  push:
    paths:
      - "src/visual_ir/compiler.py"
      - "src/visual_ir/sample_renderer.py"
      - "src/visual_ir/oracle_reconstruction_solvers.py"
      - "scripts/build_stage4_oracle_reconstruction.py"
      - "tests/validate_stage4_oracle_reconstruction.py"
      - "benchmark/generated/queuezero/gemini31flash-oracle-v1/**"
      - "experiment/queuezero/slide_semantics/**"
      - "experiment/queuezero/visual_ir/**"
      - "experiment/queuezero/style_profiles/**"
      - ".github/workflows/stage4-oracle-reconstruction.yml"
  workflow_dispatch:

concurrency:
  group: stage4-oracle-reconstruction-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-pptx pillow
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-crosextra-carlito fonts-liberation

      - name: Validate reusable Python modules
        run: |
          python -m py_compile src/visual_ir/compiler.py
          python -m py_compile src/visual_ir/sample_renderer.py
          python -m py_compile src/visual_ir/oracle_reconstruction_solvers.py
          python -m py_compile scripts/build_stage4_oracle_reconstruction.py

      - name: Build current native editable baseline
        run: |
          python scripts/create_queuezero_mock_assets.py
          python scripts/build_stage4_deck.py

      - name: Build oracle-derived editable reconstruction
        id: build
        run: python scripts/build_stage4_oracle_reconstruction.py

      - name: Validate reconstruction editability and semantic authority
        id: validate
        run: python tests/validate_stage4_oracle_reconstruction.py

      - name: Render baseline and reconstruction through fixed pipeline
        id: render
        run: |
          mkdir -p dist/stage4/oracle_reconstruction_v1/rendered/baseline
          mkdir -p dist/stage4/oracle_reconstruction_v1/rendered/reconstruction
          libreoffice --headless --convert-to pdf --outdir dist/stage4/oracle_reconstruction_v1/rendered/baseline dist/stage4/deck/queuezero_stage4_v0.pptx
          libreoffice --headless --convert-to pdf --outdir dist/stage4/oracle_reconstruction_v1/rendered/reconstruction dist/stage4/oracle_reconstruction_v1/queuezero_stage4_oracle_reconstruction_v1.pptx
          pdftoppm -png -r 144 dist/stage4/oracle_reconstruction_v1/rendered/baseline/queuezero_stage4_v0.pdf dist/stage4/oracle_reconstruction_v1/rendered/baseline/slide
          pdftoppm -png -r 144 dist/stage4/oracle_reconstruction_v1/rendered/reconstruction/queuezero_stage4_oracle_reconstruction_v1.pdf dist/stage4/oracle_reconstruction_v1/rendered/reconstruction/slide
          test -s dist/stage4/oracle_reconstruction_v1/rendered/reconstruction/slide-1.png
          test -s dist/stage4/oracle_reconstruction_v1/rendered/reconstruction/slide-2.png
          test -s dist/stage4/oracle_reconstruction_v1/rendered/reconstruction/slide-3.png

      - name: Build three-lane comparison sheets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont

          root = Path('dist/stage4/oracle_reconstruction_v1')
          oracle_root = Path('benchmark/generated/queuezero/gemini31flash-oracle-v1')
          out = root / 'comparisons'
          out.mkdir(parents=True, exist_ok=True)
          ids = ['problem-hook', 'how-it-works', 'validation-traction']
          for i, slide_id in enumerate(ids, start=1):
              paths = [
                  root / 'rendered/baseline' / f'slide-{i}.png',
                  oracle_root / f'{slide_id}.jpg',
                  root / 'rendered/reconstruction' / f'slide-{i}.png',
              ]
              images = [Image.open(p).convert('RGB') for p in paths]
              target_h = 720
              resized = []
              for im in images:
                  w = round(im.width * target_h / im.height)
                  resized.append(im.resize((w, target_h), Image.Resampling.LANCZOS))
              gap, label_h = 24, 46
              width = sum(im.width for im in resized) + gap * 2
              canvas = Image.new('RGB', (width, target_h + label_h), 'white')
              x = 0
              labels = ['native editable baseline', 'image-generated visual ceiling', 'hybrid editable reconstruction']
              draw = ImageDraw.Draw(canvas)
              for im, label in zip(resized, labels):
                  canvas.paste(im, (x, label_h))
                  draw.text((x + 8, 12), label, fill='black')
                  x += im.width + gap
              canvas.save(out / f'{slide_id}.jpg', quality=90)
          PY

      - name: Write canonical benchmark receipt
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          steps = {
              'build': os.environ.get('BUILD_OUTCOME'),
              'validate': os.environ.get('VALIDATE_OUTCOME'),
              'render': os.environ.get('RENDER_OUTCOME'),
          }
          green = all(v == 'success' for v in steps.values())
          payload = {
              'schema_version': 'stage4-oracle-reconstruction-receipt-v1',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'commit': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'canonical_green': green,
              'steps': steps,
              'visual_oracle_generation_id': 'gemini31flash-oracle-v1',
              'lanes': ['native_editable_baseline', 'image_generated_visual_ceiling', 'hybrid_editable_reconstruction'],
              'semantic_authority': 'frozen_stage3_semantic_ir',
              'full_slide_oracle_raster_used': False,
              'human_visual_comparison': 'PENDING',
          }
          results = Path('benchmark/results')
          results.mkdir(parents=True, exist_ok=True)
          (results / 'STAGE4_ORACLE_RECONSTRUCTION_LAST_ATTEMPT.json').write_text(json.dumps(payload, indent=2) + '\n')
          if green:
              (results / 'STAGE4_ORACLE_RECONSTRUCTION_LATEST.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Upload three-lane review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queuezero-stage4-oracle-reconstruction-v1
          if-no-files-found: warn
          path: |
            dist/stage4/oracle_reconstruction_v1/queuezero_stage4_oracle_reconstruction_v1.pptx
            dist/stage4/oracle_reconstruction_v1/layout_solutions.json
            dist/stage4/oracle_reconstruction_v1/realizations.json
            dist/stage4/oracle_reconstruction_v1/asset_bindings.json
            dist/stage4/oracle_reconstruction_v1/visual_ir/*.json
            dist/stage4/oracle_reconstruction_v1/rendered/**/*.pdf
            dist/stage4/oracle_reconstruction_v1/rendered/**/*.png
            dist/stage4/oracle_reconstruction_v1/comparisons/*.jpg

      - name: Commit benchmark receipt
        if: always()
        run: |
          git config user.name "stage4-oracle-reconstruction-ci"
          git config user.email "stage4-oracle-reconstruction-ci@users.noreply.github.com"
          git add benchmark/results/STAGE4_ORACLE_RECONSTRUCTION_LAST_ATTEMPT.json benchmark/results/STAGE4_ORACLE_RECONSTRUCTION_LATEST.json
          if git diff --cached --quiet; then
            echo "No receipt change"
          else
            git commit -m "ci: publish Stage 4 oracle reconstruction receipt"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
