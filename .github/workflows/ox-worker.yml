name: OX Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-ox-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run OX runner
        run: python .ox/runner/ox_runner.py
