name: Stage 3 Gemini Image Baseline — One Time

on:
  push:
    paths:
      - ".github/workflows/stage3-image-baseline-once.yml"

concurrency:
  group: stage3-gemini-image-baseline-once
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture latest failed Gemini benchmark run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmark/results
          RUN_JSON=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow stage3-image-baseline-once.yml --limit 10 --json databaseId,conclusion,status,headSha,url,createdAt --jq '[.[] | select(.headSha != env.GITHUB_SHA)][0]')
          if [ -z "${RUN_JSON}" ] || [ "${RUN_JSON}" = "null" ]; then
            echo "No earlier benchmark run found" > benchmark/results/GEMINI_ONE_TIME_LATEST.log
            printf '{"status":"no_prior_run"}\n' > benchmark/results/GEMINI_ONE_TIME_LATEST.json
          else
            echo "${RUN_JSON}" > benchmark/results/GEMINI_ONE_TIME_LATEST.json
            RUN_ID=$(echo "${RUN_JSON}" | jq -r '.databaseId')
            {
              echo "Latest earlier Stage 3 Gemini benchmark run: ${RUN_ID}"
              echo "Metadata: ${RUN_JSON}"
              echo
              gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log-failed || true
            } > benchmark/results/GEMINI_ONE_TIME_LATEST.log 2>&1
          fi

      - name: Persist diagnostic receipt
        run: |
          git config user.name "stage3-diagnostic"
          git config user.email "stage3-diagnostic@users.noreply.github.com"
          git add benchmark/results/GEMINI_ONE_TIME_LATEST.json benchmark/results/GEMINI_ONE_TIME_LATEST.log
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
          else
            git commit -m "diagnostic: capture Gemini image baseline failure"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
