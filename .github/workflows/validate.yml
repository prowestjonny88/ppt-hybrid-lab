name: Stage 3 Validate

on:
  push:
    paths:
      - "architecture/**"
      - "experiment/queuezero/**"
      - "tests/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "architecture/**"
      - "experiment/queuezero/**"
      - "tests/**"
      - "src/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-pptx

      - name: Validate Stage 3 slide semantics
        run: python tests/validate_slide_semantics.py

      - name: Validate A/B/C render-plan fairness
        run: python tests/validate_render_plans.py

      - name: Probe V2 native single-object patch
        run: python tests/probes/native_patch_probe.py

      - name: Create deterministic benchmark asset fixtures
        run: python scripts/create_queuezero_mock_assets.py

      - name: Build fairness manifests and model prompt inputs
        run: python scripts/build_stage3_variant_inputs.py

      - name: Build native-vector QueueZero benchmark deck
        run: python scripts/build_stage3_native.py

      - name: Audit native-vector PPTX objects and realization mapping
        run: python tests/audit_native_output.py

      - name: Upload Stage 3 current artifacts
        uses: actions/upload-artifact@v4
        with:
          name: queuezero-stage3-current
          path: |
            dist/queuezero_native_vector.pptx
            dist/realizations/native_vector/*.json
            dist/variant_inputs/*.json
            dist/prompts/*.txt
