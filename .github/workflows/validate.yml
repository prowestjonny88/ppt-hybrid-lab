name: Stage 3 Validate

on:
  push:
    paths:
      - "architecture/**"
      - "experiment/queuezero/**"
      - "tests/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "architecture/**"
      - "experiment/queuezero/**"
      - "tests/**"
      - "src/**"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: stage3-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stage 3 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-pptx pillow cairosvg pyyaml fonttools XlsxWriter skia-pathops uharfbuzz

      - name: Checkout pinned PPT Master reference compiler
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/hugohe3/ppt-master.git /tmp/ppt-master
          git -C /tmp/ppt-master checkout 65bb2eca59a36270819caba377097910c4466c6e
          test "$(git -C /tmp/ppt-master rev-parse HEAD)" = "65bb2eca59a36270819caba377097910c4466c6e"

      - name: Validate Stage 3 slide semantics
        id: validate_semantics
        run: python tests/validate_slide_semantics.py

      - name: Validate A/B/C render-plan fairness
        id: validate_plans
        run: python tests/validate_render_plans.py

      - name: Probe V2 native single-object patch
        id: probe_v2
        run: python tests/probes/native_patch_probe.py

      - name: Create deterministic benchmark asset fixtures
        id: assets
        run: python scripts/create_queuezero_mock_assets.py

      - name: Build fairness manifests and model prompt inputs
        id: variant_inputs
        run: python scripts/build_stage3_variant_inputs.py

      - name: Build native-vector QueueZero benchmark deck
        id: build_native
        run: python scripts/build_stage3_native.py

      - name: Audit native-vector PPTX objects and realization mapping
        id: audit_native
        run: python tests/audit_native_output.py

      - name: Build hybrid QueueZero benchmark deck
        id: build_hybrid
        run: python scripts/build_stage3_hybrid.py --ppt-master-root /tmp/ppt-master

      - name: Audit hybrid PPTX native SVG and bounded image structure
        id: audit_hybrid
        run: python tests/audit_hybrid_output.py

      - name: Run native-vector panic edits
        id: panic_native
        if: always() && steps.audit_native.outcome == 'success'
        continue-on-error: true
        run: python tests/run_panic_edits_safe.py --variant native_vector --pptx dist/queuezero_native_vector.pptx --out-dir dist/panic/native_vector

      - name: Run hybrid panic edits
        id: panic_hybrid
        if: always() && steps.audit_hybrid.outcome == 'success'
        continue-on-error: true
        run: python tests/run_panic_edits_safe.py --variant hybrid --pptx dist/queuezero_hybrid.pptx --out-dir dist/panic/hybrid

      - name: Final Stage 3 panic gate
        id: panic_gate
        if: always()
        env:
          PANIC_NATIVE: ${{ steps.panic_native.outcome }}
          PANIC_HYBRID: ${{ steps.panic_hybrid.outcome }}
        run: |
          echo "native panic outcome: ${PANIC_NATIVE}"
          echo "hybrid panic outcome: ${PANIC_HYBRID}"
          if [ "${PANIC_NATIVE}" != "success" ] || [ "${PANIC_HYBRID}" != "success" ]; then
            echo "At least one Stage 3 panic suite failed or was skipped."
            exit 1
          fi

      - name: Capture original paid Gemini benchmark failure
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PAID_RUN_HEAD_SHA: cb65460e205145e65497b6df7c784127a04ed8cb
        shell: bash
        run: |
          set +e
          mkdir -p benchmark/results
          META=benchmark/results/GEMINI_ONE_TIME_PAID_RUN.json
          LOG=benchmark/results/GEMINI_ONE_TIME_PAID_RUN.log
          : > "$LOG"
          RAW=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/stage3-image-baseline-once.yml/runs?per_page=20" 2>>"$LOG")
          API_RC=$?
          if [ $API_RC -ne 0 ]; then
            printf '{"status":"diagnostic_api_error","exit_code":%s}\n' "$API_RC" > "$META"
          else
            echo "$RAW" | jq --arg sha "$PAID_RUN_HEAD_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0] | {id,status,conclusion,head_sha,html_url,created_at,updated_at}' > "$META" 2>>"$LOG"
            RUN_ID=$(jq -r '.id // empty' "$META")
            if [ -n "$RUN_ID" ]; then
              echo "Resolved paid benchmark run ID: $RUN_ID" >> "$LOG"
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed >> "$LOG" 2>&1
              echo "gh run view exit code: $?" >> "$LOG"
            else
              echo "Original paid benchmark run not found." >> "$LOG"
            fi
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('benchmark/results/GEMINI_ONE_TIME_PAID_RUN.log')
          text = p.read_text(errors='replace') if p.exists() else ''
          p.write_text(text[-120000:], encoding='utf-8')
          PY

      - name: Upload Stage 3 current artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queuezero-stage3-current
          if-no-files-found: warn
          path: |
            dist/queuezero_native_vector.pptx
            dist/queuezero_hybrid.pptx
            dist/realizations/native_vector/*.json
            dist/realizations/hybrid/*.json
            dist/ppt_master_adapter_workspace/trace.json
            dist/ppt_master_adapter_workspace/validation/*.json
            dist/panic/native_vector/summary.json
            dist/panic/hybrid/summary.json
            dist/variant_inputs/*.json
            dist/prompts/*.txt
            benchmark/results/GEMINI_ONE_TIME_PAID_RUN.json
            benchmark/results/GEMINI_ONE_TIME_PAID_RUN.log

      - name: Write tracked Stage 3 CI receipt
        if: always() && github.event_name != 'pull_request'
        env:
          STAGE3_JOB_STATUS: ${{ job.status }}
          STAGE3_VALIDATE_SEMANTICS: ${{ steps.validate_semantics.outcome }}
          STAGE3_VALIDATE_PLANS: ${{ steps.validate_plans.outcome }}
          STAGE3_PROBE_V2: ${{ steps.probe_v2.outcome }}
          STAGE3_ASSETS: ${{ steps.assets.outcome }}
          STAGE3_VARIANT_INPUTS: ${{ steps.variant_inputs.outcome }}
          STAGE3_BUILD_NATIVE: ${{ steps.build_native.outcome }}
          STAGE3_AUDIT_NATIVE: ${{ steps.audit_native.outcome }}
          STAGE3_BUILD_HYBRID: ${{ steps.build_hybrid.outcome }}
          STAGE3_AUDIT_HYBRID: ${{ steps.audit_hybrid.outcome }}
          STAGE3_PANIC_NATIVE: ${{ steps.panic_native.outcome }}
          STAGE3_PANIC_HYBRID: ${{ steps.panic_hybrid.outcome }}
        run: python scripts/write_stage3_ci_receipt.py

      - name: Commit Stage 3 CI receipt and Gemini diagnostic
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "stage3-ci"
          git config user.email "stage3-ci@users.noreply.github.com"
          git add benchmark/results/STAGE3_CI_LATEST.json benchmark/results/GEMINI_ONE_TIME_PAID_RUN.json benchmark/results/GEMINI_ONE_TIME_PAID_RUN.log
          if git diff --cached --quiet; then
            echo "No CI receipt/diagnostic change"
          else
            git commit -m "ci: publish Stage 3 receipt and Gemini failure diagnostic"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
