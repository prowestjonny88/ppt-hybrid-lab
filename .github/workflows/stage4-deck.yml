name: Stage 4 QueueZero Full Deck

on:
  push:
    paths:
      - "architecture/ARCHETYPE_ROUTING_RULES.stage4.v0.json"
      - "architecture/DESIGN_LANGUAGES.stage4.v0.json"
      - "src/visual_ir/**"
      - "scripts/build_stage4_deck.py"
      - "scripts/create_queuezero_mock_assets.py"
      - "tests/audit_stage4_deck.py"
      - "tests/validate_stage4_realization_identity.py"
      - "tests/panic_stage4_provenance_identity.py"
      - "tests/panic_stage4_text_capacity.py"
      - "tests/validate_stage4_capacity.py"
      - "tests/panic_stage4_capacity.py"
      - "tests/validate_stage4_routing.py"
      - "tests/panic_stage4_routing.py"
      - "tests/panic_stage4_solver_contracts.py"
      - "tests/panic_stage4_style_layering.py"
      - "tests/panic_stage4_asset_bindings.py"
      - "tests/panic_stage4_visual_ir.py"
      - "tests/panic_stage4_deck_rhythm.py"
      - "tests/validate_stage4_deck_rhythm.py"
      - "tests/validate_stage4_solver_registry.py"
      - "tests/validate_stage4_style_layering.py"
      - "tests/validate_visual_ir.py"
      - "experiment/queuezero/stage4_asset_bindings.json"
      - "experiment/queuezero/stage4_deck_plan.v0.json"
      - "experiment/queuezero/visual_ir/**"
      - "experiment/queuezero/style_profiles/**"
      - "experiment/queuezero/slide_semantics/**"
      - "experiment/queuezero/assets/**"
      - "benchmark/generated/queuezero/gemini31flashimage-v1/hybrid/**"
      - ".github/workflows/stage4-deck.yml"
  workflow_dispatch:

concurrency:
  group: stage4-queuezero-deck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-pptx pillow
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-crosextra-carlito fonts-liberation
      - name: Generate deterministic QueueZero benchmark fixtures
        run: python scripts/create_queuezero_mock_assets.py
      - name: Validate style layering, assets, Visual IR, capacity, routing, rhythm and solver boundary
        id: validate
        run: |
          python tests/validate_stage4_style_layering.py
          python tests/panic_stage4_style_layering.py
          python tests/panic_stage4_asset_bindings.py
          python tests/validate_visual_ir.py
          python tests/panic_stage4_visual_ir.py
          python tests/validate_stage4_capacity.py
          python tests/panic_stage4_capacity.py
          python tests/validate_stage4_routing.py
          python tests/panic_stage4_routing.py
          python tests/panic_stage4_solver_contracts.py
          python tests/validate_stage4_deck_rhythm.py
          python tests/panic_stage4_deck_rhythm.py
          python tests/validate_stage4_compiler.py
          python tests/validate_stage4_solver_registry.py
      - name: Build three-slide editable deck
        id: build
        run: python scripts/build_stage4_deck.py
      - name: Structural, provenance, realization-identity and text-capacity audit
        id: audit
        run: |
          python tests/audit_stage4_deck.py
          python tests/validate_stage4_realization_identity.py
          python tests/panic_stage4_provenance_identity.py
          python tests/panic_stage4_text_capacity.py
      - name: Render all slides
        id: render
        run: |
          mkdir -p dist/stage4/deck/rendered
          libreoffice --headless --convert-to pdf --outdir dist/stage4/deck/rendered dist/stage4/deck/queuezero_stage4_v0.pptx
          test -s dist/stage4/deck/rendered/queuezero_stage4_v0.pdf
          pdftoppm -png -r 144 dist/stage4/deck/rendered/queuezero_stage4_v0.pdf dist/stage4/deck/rendered/queuezero_stage4_v0
          test -s dist/stage4/deck/rendered/queuezero_stage4_v0-1.png
          test -s dist/stage4/deck/rendered/queuezero_stage4_v0-2.png
          test -s dist/stage4/deck/rendered/queuezero_stage4_v0-3.png
      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queuezero-stage4-full-deck
          if-no-files-found: warn
          path: |
            dist/stage4/deck/queuezero_stage4_v0.pptx
            dist/stage4/deck/layout_solutions.json
            dist/stage4/deck/realizations.json
            dist/stage4/deck/rendered/queuezero_stage4_v0.pdf
            dist/stage4/deck/rendered/*.png
      # Receipt v15 includes both source→layout→realization provenance identity
      # and PPTX round-trip realization identity. Keep this workflow edit as a
      # deterministic clean-run trigger after concurrency-cancelled hardening runs.
      - name: Write run receipt
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          mkdir -p benchmark/results
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          steps = {
            "validation": os.environ.get("VALIDATE_OUTCOME"),
            "build": os.environ.get("BUILD_OUTCOME"),
            "audit": os.environ.get("AUDIT_OUTCOME"),
            "render": os.environ.get("RENDER_OUTCOME"),
          }
          all_green = all(value == "success" for value in steps.values())
          payload = {
            "schema_version": "stage4-deck-receipt-v15",
            "generated_at": datetime.now(timezone.utc).isoformat(),
            "commit": os.environ.get("GITHUB_SHA"),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "artifact_name": "queuezero-stage4-full-deck",
            "canonical_green": all_green,
            "steps": steps,
            "validation_contract": [
              "design_language_profile_layering",
              "style_layering_fail_closed_panic",
              "asset_binding_fail_closed_panic",
              "visual_ir",
              "visual_ir_fail_closed_panic",
              "archetype_capacity",
              "capacity_fail_closed_panic",
              "deterministic_routing",
              "routing_fail_closed_panic",
              "solver_contract_fail_closed_panic",
              "deck_rhythm",
              "deck_rhythm_fail_closed_panic",
              "all_slide_compiler",
              "archetype_solver_registry",
              "source_layout_realization_provenance_identity",
              "provenance_identity_negative_regression",
              "pptx_realization_round_trip_identity",
              "realization_identity_negative_regression",
              "semantic_text_capacity",
              "text_capacity_fail_closed_panic"
            ]
          }
          attempt = Path("benchmark/results/STAGE4_DECK_LAST_ATTEMPT.json")
          attempt.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          if all_green:
            Path("benchmark/results/STAGE4_DECK_LATEST.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
            )
          PY
      - name: Commit receipts
        if: always()
        run: |
          git config user.name "stage4-deck-ci"
          git config user.email "stage4-deck-ci@users.noreply.github.com"
          git add benchmark/results/STAGE4_DECK_LAST_ATTEMPT.json benchmark/results/STAGE4_DECK_LATEST.json
          if git diff --cached --quiet; then
            echo "No receipt change"
          else
            git commit -m "ci: publish Stage 4 full-deck receipt"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
